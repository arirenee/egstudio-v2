name: Build approved sample thumbnails (review branch only)

on:
  push:
    branches:
      - design/final-mobile-polish-20261113
    paths:
      - .github/workflows/final-sample-posters.yml

permissions:
  contents: write

jobs:
  generate-posters:
    if: github.ref == 'refs/heads/design/final-mobile-polish-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: design/final-mobile-polish-20261113
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor and verify ffmpeg
        run: |
          python -m pip install pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Extract actual source footage thumbnails
        run: python qa/build_sample_posters.py
      - name: Upload contact sheets for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg-poster-frame-choices
          path: |
            qa-artifacts/poster-candidates/
            assets/samples/sample-process-thumb.jpg
            assets/samples/sample-panel-thumb.jpg
            assets/samples/sample-saas-founder-thumb.jpg
          if-no-files-found: warn
      - name: Commit thumbnail assets to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/samples/sample-process-thumb.jpg assets/samples/sample-panel-thumb.jpg assets/samples/sample-saas-founder-thumb.jpg
          if git diff --cached --quiet; then
            echo "No thumbnail changes"
          else
            git commit -m "Add real video frame posters for EG homepage review [skip-frame-build]"
            git push origin HEAD:refs/heads/design/final-mobile-polish-20261113
          fi
