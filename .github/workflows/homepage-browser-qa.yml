name: Homepage browser QA (no deploy)

on:
  pull_request:
    paths:
      - '**/*.html'
      - assets/css/visual-first-home.css
      - qa/sitewide_copy_qa.py
      - qa/final_mobile_polish_qa.py
      - assets/samples/*-thumb.jpg
      - qa/home_visual_qa.py
      - qa/webkit_mobile_qa.py
      - .github/workflows/homepage-browser-qa.yml

permissions:
  contents: read

jobs:
  review-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit sitewide visible copy and approved FAQ
        run: python qa/sitewide_copy_qa.py
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Start local review server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/eg-qa-server.log 2>&1 &
          echo $! >/tmp/eg-qa-server.pid
          sleep 2
      - name: Run real viewport and playback QA
        run: python qa/home_visual_qa.py
      - name: Run WebKit mobile QA
        run: python qa/webkit_mobile_qa.py
      - name: Verify final mobile hero, FAQ and real video thumbnails
        run: python qa/final_mobile_polish_qa.py
      - name: Save screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg-homepage-visual-qa
          path: qa-artifacts/
          if-no-files-found: warn
