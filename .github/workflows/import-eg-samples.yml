name: Import EG sample assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-eg-samples.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import assets and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/samples
          curl --fail --location --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ff9c-81fd-9117-707b2a24082d/raw?se=2026-09-29T17%3A10%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=39d6fa20-8e56-5eba-a1bf-55105123ec04&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T11%3A58%3A51Z&ske=2026-09-30T11%3A58%3A51Z&sks=b&skv=2026-02-06&sig=u68JKVCGv2OX1i%2B2mKbX9Dc9H7GGQWoP8r569%2BZovFU%3D' -o 'assets/samples/sample-panel.jpg'
          curl --fail --location --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-9d50-8230-8de2-faf25e2ea9cb/raw?se=2026-09-29T17%3A10%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=ca6ca82e-0fe7-53f6-8e21-522843cd4404&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T13%3A58%3A57Z&ske=2026-09-30T13%3A58%3A57Z&sks=b&skv=2026-02-06&sig=lvgMfHfdG1dioN1XhgHxGviF1mib910NwRd6eih07/M%3D' -o 'assets/samples/sample-panel.mp4'
          curl --fail --location --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-7630-8230-9ef4-dc78bb9b1768/raw?se=2026-09-29T17%3A10%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=cd18dd7e-390c-52e9-b5b0-c5f6ede9b761&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A01%3A24Z&ske=2026-09-30T04%3A01%3A24Z&sks=b&skv=2026-02-06&sig=1hJZcZB0IT2laCFAjJnWynQ00uiVoywbVfJ2h9M02H8%3D' -o 'assets/samples/sample-process.jpg'
          curl --fail --location --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-1f8c-8230-9956-5b63f8289acc/raw?se=2026-09-29T17%3A10%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=c61b28f4-e5e4-5761-866b-9b1c6c870e12&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A52%3A28Z&ske=2026-09-30T03%3A52%3A28Z&sks=b&skv=2026-02-06&sig=okxwwbn60cbgO%2BAGWtZdL0zS7eN%2BCFLEjurYx6npPHw%3D' -o 'assets/samples/sample-process.mp4'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/import-eg-samples.yml'
          git add assets/samples/sample-panel.jpg assets/samples/sample-panel.mp4 assets/samples/sample-process.jpg assets/samples/sample-process.mp4
          git commit -m 'Update EG Studio sample assets'
          git push origin HEAD:main
